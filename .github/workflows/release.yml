name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -e
          V=${GODOT_VERSION}-stable
          BASE=https://github.com/godotengine/godot/releases/download/$V
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -fsSLO $BASE/Godot_v${V}_linux.x86_64.zip
          curl -fsSLO $BASE/Godot_v${V}_export_templates.tpz
          curl -fsSLO $BASE/SHA512-SUMS.txt
          grep -E "Godot_v${V}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v${V}_linux.x86_64.zip
          mv Godot_v${V}_linux.x86_64 godot && chmod +x godot
          unzip -q Godot_v${V}_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ./godot --version

      - name: Import assets (headless)
        run: |
          # first import pass; a non-zero exit from the editor on first import is tolerated, the export below verifies
          timeout 90m ~/godot/godot --headless --path . --import || true
          test -d .godot/imported

      - name: Export and package (Linux + Windows, embedded PCK)
        run: GODOT=$HOME/godot/godot sh tools/package.sh

      - name: Check packages
        run: |
          tar -tzvf dist/MishmeretLayla-linux.tar.gz
          unzip -l dist/MishmeretLayla-windows.zip
          test "$(stat -c %s build/linux/MishmeretLayla.x86_64)" -gt 100000000
          test "$(stat -c %s build/windows/MishmeretLayla.exe)" -gt 100000000

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/MishmeretLayla-linux.tar.gz dist/MishmeretLayla-windows.zip \
            --title "משמרת לילה — מהדורת PC $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
