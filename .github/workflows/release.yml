name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }} and export templates
        run: |
          set -e
          V=${GODOT_VERSION}-stable
          BASE=https://github.com/godotengine/godot/releases/download/$V
          mkdir -p ~/godot ~/.local/share/godot/export_templates
          cd ~/godot
          curl -fsSLO $BASE/Godot_v${V}_linux.x86_64.zip
          curl -fsSLO $BASE/Godot_v${V}_export_templates.tpz
          curl -fsSLO $BASE/SHA512-SUMS.txt
          grep -E "Godot_v${V}_(linux.x86_64.zip|export_templates.tpz)$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q Godot_v${V}_linux.x86_64.zip
          mv Godot_v${V}_linux.x86_64 godot && chmod +x godot
          unzip -q Godot_v${V}_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ./godot --version
          python3 -m pip install --quiet pillow

      - name: Import assets with VRAM compression (headless)
        run: |
          set -e
          python3 tools/fix-texture-imports.py
          timeout 100m ~/godot/godot --headless --path . --import || true
          # the glTF importer may rewrite .import files of textures it extracts: enforce again, re-import
          python3 tools/fix-texture-imports.py
          timeout 100m ~/godot/godot --headless --path . --import || true
          test -d .godot/imported

      - name: Render the bundled loading-screen shots (software GL, no HUD)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers >/dev/null
          mkdir -p assets/loading
          # 1) Forward+ on lavapipe (software Vulkan) - the real renderer
          LOADSHOTS_DIR=$PWD/assets/loading BENCH_OUT=/tmp/loadshots.txt xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 25m ~/godot/godot --path . --rendering-driver vulkan --rendering-method forward_plus --fixed-fps 60 -- --loadshots > loadshots.log 2>&1 || true
          grep -E "Vulkan|LOADSHOT|\[load\]|SCRIPT ERROR|QUIT_CLEAN|LOAD_TIME|crash" loadshots.log | head -60 || true
          # 2) fallback: compatibility renderer on software GL
          if [ "$(ls assets/loading/*.jpg 2>/dev/null | wc -l)" -lt 4 ]; then
            LOADSHOTS_DIR=$PWD/assets/loading BENCH_OUT=/tmp/loadshots.txt xvfb-run -a -s "-screen 0 1280x720x24" \
              timeout 25m ~/godot/godot --path . --rendering-driver opengl3 --rendering-method gl_compatibility --fixed-fps 60 -- --loadshots > loadshots-gl.log 2>&1 || true
            grep -E "OpenGL|LOADSHOT|\[load\]|SCRIPT ERROR|QUIT_CLEAN|crash" loadshots-gl.log | head -60 || true
          fi
          ls -la assets/loading

      - name: Import the loading shots
        run: |
          python3 tools/fix-texture-imports.py
          timeout 30m ~/godot/godot --headless --path . --import || true

      - name: Check texture compression (fail on any uncompressed 3D texture)
        run: |
          python3 tools/check-ctex.py
          echo "imported data: $(du -sh .godot/imported | cut -f1)"; ls -S -l .godot/imported | head -12

      - name: Export and package (Linux + Windows, embedded PCK)
        run: GODOT=$HOME/godot/godot sh tools/package.sh

      - name: Automated playthrough of the exported Linux build (every zone, both branches, bosses)
        run: |
          cd build/linux
          set +e
          BENCH_OUT=$PWD/autotest.txt timeout 60m ./MishmeretLayla.x86_64 --headless --fixed-fps 60 -- --autotest > autotest.log 2>&1
          code=$?
          set -e
          grep -E "LOAD_TIME_MS|STAGE_WAIT_MS|BENCH_STUCK|SCRIPT ERROR|zones:|QUIT_CLEAN|Aborted|core dumped" autotest.log || true
          echo "---- errors (exit-time leak reports excluded) ----"
          grep -E "SCRIPT ERROR|^ERROR" autotest.log | grep -vE "leaked|still in use at exit|Pages in use" | sort | uniq -c | head -40 || true
          echo "exit code: $code"
          test $code -eq 0
          grep -q "stuck: 0" autotest.log
          grep -E "zones: 30 " autotest.log
          grep -q "QUIT_CLEAN code=0" autotest.log
          ! grep -qE "SCRIPT ERROR|Aborted|core dumped|not supported by hardware" autotest.log

      - name: Real player flow of the exported Linux build (menu -> stages 1-3 -> ending, quit)
        run: |
          cd build/linux
          set +e
          timeout 60m ./MishmeretLayla.x86_64 --headless --fixed-fps 60 -- --flowtest > flowtest.log 2>&1
          code=$?
          set -e
          grep -E "LOAD_TIME_MS|MENU_LIVE_MS|STAGE_WAIT_MS|FLOW|ready at|QUIT_CLEAN|SCRIPT ERROR|Aborted|core dumped" flowtest.log || true
          echo "exit code: $code"
          test $code -eq 0
          grep -q "FLOW_DONE stages=3" flowtest.log
          grep -q "QUIT_CLEAN code=0" flowtest.log
          ! grep -qE "SCRIPT ERROR|Aborted|core dumped" flowtest.log

      - name: Check packages
        run: |
          tar -tzvf dist/MishmeretLayla-linux.tar.gz
          unzip -l dist/MishmeretLayla-windows.zip
          ls -la dist build/linux build/windows
          test -x build/linux/MishmeretLayla.x86_64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build/linux/autotest.log
            build/linux/autotest.txt
            build/linux/flowtest.log
            loadshots.log
            loadshots-gl.log
            assets/loading/*.jpg
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sed "s/{TAG}/$GITHUB_REF_NAME/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/MishmeretLayla-linux.tar.gz dist/MishmeretLayla-windows.zip \
            --title "משמרת לילה — מהדורת PC $GITHUB_REF_NAME" --notes-file notes.md --latest
